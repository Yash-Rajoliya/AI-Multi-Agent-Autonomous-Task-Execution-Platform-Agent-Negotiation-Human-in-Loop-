version: "3.9"

services:
  api:
    build:
      context: ../../
      dockerfile: deployments/docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    depends_on:
      - redis
      - db

  worker:
    build:
      context: ../../
      dockerfile: deployments/docker/worker.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - redis

  orchestrator:
    build:
      context: ../../
      dockerfile: deployments/docker/orchestrator.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_platform
    ports:
      - "5432:5432"